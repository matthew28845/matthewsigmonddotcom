baseURL = '/'
languageCode = 'en-us'
title = "Matthew Sigmond's Personal Website"
theme = 'mainroad'

[Site.Params.Author]
    name = "Matt Sigmond"

[Site.Params.baseURL]
    url = "https://matthewsigmond.com"

[Params]
    description = "Matthew Sigmond's personal website"
    copyright = "Matthew Sigmond"
    mainSections = ["homepage", "blog", "photography", "post"]
    post_meta = ["author", "date", "categories", "translations"] # Order of post meta information    
    sectionPagesMenu = 'main'
    
[Params.style.vars]
    highlightColor = "#FF4F00"

[Params.sidebar]
    widgets = ["search", "recent", "social", "categories"] # Order of sidebar widgets
    home = "right"
    list = "right"
    single = "right"

[Params.widgets.social]
    instagram = "matthewsigmond"
    github = "matthew28845"
    linkedin = "matthew-sigmond-39158b27b"

[Params.widgets]
  recent_num = 5 # Set the number of articles in the "Recent articles" widget


[Params.widgets.recent]
  cached = true

[Params.thumbnail]
  visibility = ["list", "post"] # Control thumbnail visibility

[markup.goldmark.renderer]
 unsafe = true

[Params.logo]
  title = "Matthew Sigmond"
  image = "/posts/photography/images/headshot.png"

[Params.widgets.search]
  cached = false # activate cache if true
  url = "https://google.com/search"
  [Params.widgets.search.input]
    name = "sitesearch"
    pre = ""

[menus]
  [[menus.main]]
    name = 'Résumé'
    url = 'pages/files/Resume_Sep2025.pdf'
    weight = 10